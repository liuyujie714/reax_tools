species_count:
  default_file: species_count.csv
  figure_width: 6.0
  figure_height: 4.0
  line_width: 1.8
  max_per_page: 8
  min_per_page: 4
  page_method: default
  legend_columns: 4
  label_subscripts: true

bond_count:
  default_file: bond_count.csv
  figure_width: 6.0
  figure_height: 4.0
  line_width: 1.8
  max_per_page: 8
  min_per_page: 4
  page_method: default
  legend_columns: 4
  label_subscripts: false

atom_bonded_num_count:
  default_file: atom_bonded_num_count.csv
  figure_width: 6.0
  figure_height: 4.0
  line_width: 1.8
  max_per_page: 8
  min_per_page: 4
  page_method: default
  legend_columns: 4
  label_subscripts: false

ring_count:
  default_file: ring_count.csv
  figure_width: 5.5
  figure_height: 3.6
  line_width: 1.8
  max_per_page: 8
  min_per_page: 4
  page_method: default
  legend_columns: 4
  label_subscripts: false

reaction_events:
  max_reactions: 15
  figure_width: 7.0
  row_height: 0.34
  min_height: 4.0
  color_map: YlGnBu
  alpha: 0.72
  embed_molecules: false

transfer_flow:
  filter_max_reactions: false
  filter_max_molecules: 15
  filter_max_subgraphs: 3
  layout: dot
  figure_width: 4.0
  figure_height: 4.0
  color_map: YlGnBu
  alpha: 0.78
  edge_width_min: 1.5
  edge_width_max: 4.5
  node_size_min: 200
  node_size_max: 500
  node_box_aspect: 2.0
  node_box_height: 0.62
  show_edge_labels: false
  show_colorbar: true
  top_reactions: 10
  top_reactions_height: 1.35

center_flow:
  weight: atom_transfer
  centers: 5
  depth: 1
  max_in: 8
  max_out: 8
  figure_width: 7.0
  figure_height: 4.2
  color_map: fresh
  alpha: 0.56
  edge_width_min: 2.0
  edge_width_max: 15.0
  bar_width: 0.9
  max_bar_height: 3.5
  min_bar_height: 0.75
  min_segment_height: 0.18
  segment_gap: 0.035
  layer_spacing: 2.35
  label_min_height: 0.24
  inside_label_max_chars: 5
  outside_label_gap: 0.24
  font_size: 12

flow:
  weight: atom_transfer
  role_breaks: [-0.65, -0.25, 0.25, 0.65]
  max_species_per_level: 6
  max_links: 24
  keep_terminal_species: 4
  keep_anchor_links: 4
  terminal_size_penalty: 0.65
  show_discarded_note: true
  figure_width: 8.6
  figure_height: 4.8
  color_map: fresh
  alpha: 0.56
  edge_width_min: 3.0
  edge_width_max: 16.0
  bar_width: 0.95
  max_bar_height: 3.9
  min_bar_height: 0.72
  min_segment_height: 0.17
  segment_gap: 0.035
  layer_spacing: 2.25
  label_min_height: 0.23
  inside_label_max_chars: 5
  outside_label_gap: 0.22
  font_size: 10
